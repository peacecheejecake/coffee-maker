name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm depcheck
      - run: pnpm test

  # Server rules and multi-device sync against a real local Supabase, plus the app's e2e flows.
  # Screenshot tests (@visual) run in the "visual" job instead.
  integration:
    # Not ubuntu-latest: that label moved to 26.04, which Playwright 1.56 cannot install Chromium on.
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta
      - run: pnpm test:int
      # On Linux the tests use Playwright's bundled Chromium (see playwright.config.ts).
      - run: pnpm --filter @coffee/web exec playwright install --with-deps chromium
      - run: pnpm --filter @coffee/web e2e:ci
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results

  # Screenshot tests against the *-linux.png baselines, in the image scripts/linux-baselines.sh records them with.
  visual:
    runs-on: ubuntu-latest
    needs: check
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @coffee/web exec playwright test --project=local --grep @visual --retries=0
        env:
          HOME: /root
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: apps/web/test-results

  # main only, once every check above passed: the same prebuilt deploy as `pnpm deploy:web` (vercel.json keeps
  # Vercel's own Git builds off). Database migrations are still pushed by hand.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [check, integration, visual]
    # One at a time, in push order; a deploy already running is never cut off.
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm deploy:web
